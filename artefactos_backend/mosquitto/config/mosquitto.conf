# Configuración de Mosquitto para desarrollo / maqueta.
# ADVERTENCIA: acepta conexiones anónimas. Para exponerlo a internet, crear un
# archivo de contraseñas (mosquitto_passwd) y cambiar allow_anonymous a false.
persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 1883
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true
